<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tienda Siles</title>

<link rel="stylesheet"
href="css/estilos.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

<h1>Tienda Siles</h1>

<p>Perfumes Originales</p>

</div>

<div class="acciones">

<input
type="text"
id="buscar"
placeholder="Buscar perfume...">

<button id="modoOscuro">

<i class="fa-solid fa-moon"></i>

</button>

</div>

</header>

<section class="banner">

<h2>Encuentra tu Fragancia Ideal</h2>

<p>Perfumes para Hombre, Mujer y Unisex</p>

</section>

<section class="filtros">

<select id="categoria">

<option value="Todos">

Todas las categorías

</option>

<option value="Hombre">

Hombre

</option>

<option value="Mujer">

Mujer

</option>

<option value="Unisex">

Unisex

</option>

</select>

<select id="orden">

<option value="">

Ordenar por precio

</option>

<option value="asc">

Menor a Mayor

</option>

<option value="desc">

Mayor a Menor

</option>

</select>

</section>

<section
id="catalogo"
class="catalogo">

</section>

<a
class="whatsappFlotante"
target="_blank"
href="https://wa.me/50576014531">

<i class="fab fa-whatsapp"></i>

</a>

<footer>

<p>

© 2026 Tienda Siles

</p>

</footer>

<script src="js/productos.js"></script>

<script src="js/app.js"></script>

</body>

</html>
