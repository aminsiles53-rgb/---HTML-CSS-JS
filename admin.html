<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel de Administración | Tienda Siles</title>

<link rel="stylesheet" href="css/estilos.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

background:#f4f4f4;

font-family:Poppins,sans-serif;

}

.login{

max-width:420px;

margin:80px auto;

background:white;

padding:35px;

border-radius:15px;

box-shadow:0 10px 20px rgba(0,0,0,.15);

}

.login h2{

text-align:center;

margin-bottom:25px;

}

.login input{

width:100%;

padding:14px;

margin-bottom:20px;

border:none;

background:#ececec;

border-radius:10px;

}

.login button{

width:100%;

padding:14px;

border:none;

background:#111827;

color:white;

border-radius:10px;

cursor:pointer;

font-size:16px;

}

#panel{

display:none;

padding:30px;

}

.topbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.topbar button{

padding:12px 18px;

border:none;

background:#111827;

color:white;

border-radius:10px;

cursor:pointer;

}

.estadisticas{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.card h3{

font-size:30px;

margin-top:10px;

}

.formulario{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

margin-bottom:30px;

}

.formulario input,

.formulario textarea,

.formulario select{

width:100%;

padding:12px;

margin-bottom:15px;

border:none;

background:#ececec;

border-radius:10px;

}

.formulario button{

padding:14px;

width:100%;

border:none;

background:#111827;

color:white;

border-radius:10px;

cursor:pointer;

}

table{

width:100%;

border-collapse:collapse;

background:white;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

th,td{

padding:14px;

border-bottom:1px solid #ddd;

text-align:left;

}

th{

background:#111827;

color:white;

}

img.mini{

width:60px;

height:60px;

object-fit:cover;

border-radius:8px;

}

.acciones button{

margin-right:5px;

padding:8px 12px;

border:none;

border-radius:8px;

cursor:pointer;

}

.editar{

background:#2563eb;

color:white;

}

.eliminar{

background:#dc2626;

color:white;

}

</style>

</head>

<body>

<div class="login" id="login">

<h2>Panel de Administración</h2>

<input
type="password"
id="password"
placeholder="Contraseña">

<button onclick="login()">

Ingresar

</button>

</div>

<div id="panel">

<div class="topbar">

<h1>Tienda Siles</h1>

<button onclick="cerrarSesion()">

Cerrar sesión

</button>

</div>

<div class="estadisticas">

<div class="card">

Productos

<h3 id="cantidadProductos">

0

</h3>

</div>

<div class="card">

Valor Inventario

<h3 id="valorInventario">

$0

</h3>

</div>

</div>

<div class="formulario">

<h2>Agregar / Editar Producto</h2>

<input
type="hidden"
id="idProducto">

<input
type="text"
id="nombre"
placeholder="Nombre">

<input
type="text"
id="marca"
placeholder="Marca">

<input
type="number"
id="precio"
placeholder="Precio">

<select id="categoria">

<option>Hombre</option>

<option>Mujer</option>

<option>Unisex</option>

</select>

<textarea
id="descripcion"
placeholder="Descripción"></textarea>

<input
type="text"
id="imagen1"
placeholder="Imagen 1">

<input
type="text"
id="imagen2"
placeholder="Imagen 2">

<input
type="text"
id="imagen3"
placeholder="Imagen 3">

<button onclick="guardarProducto()">

Guardar Producto

</button>

</div>

<h2>Lista de Productos</h2>

<table>

<thead>

<tr>

<th>Imagen</th>

<th>Nombre</th>

<th>Marca</th>

<th>Precio</th>

<th>Categoría</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaProductos">

</tbody>

</table>

</div>

<script src="js/productos.js"></script>

<script src="js/admin.js"></script>

</body>

</html>
